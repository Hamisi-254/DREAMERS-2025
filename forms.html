<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complete HTML Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }
        form {
            background: #fff;
            padding: 20px;
            max-width: 700px;
            margin: auto;
            border-radius: 5px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }
        input, select, textarea, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        fieldset {
            margin-top: 15px;
            padding: 15px;
        }
        legend {
            font-weight: bold;
        }
        .inline {
            width: auto;
            margin-right: 10px;
        }
        button {
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<form action="submit.php" method="post" enctype="multipart/form-data">

    <!-- Hidden Field -->
    <input type="hidden" name="form_id" value="registration_form">

    <h2>Complete HTML Form Example</h2>

    <!-- Text Inputs -->
    <label for="fname">First Name</label>
    <input type="text" id="fname" name="first_name" placeholder="Enter first name" required>

    <label for="lname">Last Name</label>
    <input type="text" id="lname" name="last_name" placeholder="Enter last name" required>

    <!-- Email -->
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="example@email.com" required>

    <!-- Password -->
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <!-- Number -->
    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="1" max="120">

    <!-- Date -->
    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob">

    <!-- Telephone -->
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="+254700000000">

    <!-- Radio Buttons -->
    <fieldset>
        <legend>Gender</legend>
        <input type="radio" id="male" name="gender" value="male" class="inline">
        <label for="male" class="inline">Male</label>

        <input type="radio" id="female" name="gender" value="female" class="inline">
        <label for="female" class="inline">Female</label>
    </fieldset>

    <!-- Checkboxes -->
    <fieldset>
        <legend>Hobbies</legend>
        <input type="checkbox" id="sports" name="hobbies[]" value="sports" class="inline">
        <label for="sports" class="inline">Sports</label>

        <input type="checkbox" id="music" name="hobbies[]" value="music" class="inline">
        <label for="music" class="inline">Music</label>

        <input type="checkbox" id="reading" name="hobbies[]" value="reading" class="inline">
        <label for="reading" class="inline">Reading</label>
    </fieldset>

    <!-- Select Dropdown -->
    <label for="country">Country</label>
    <select id="country" name="country">
        <option value="">-- Select Country --</option>
        <option value="kenya">Kenya</option>
        <option value="uganda">Uganda</option>
        <option value="tanzania">Tanzania</option>
    </select>

    <!-- Textarea -->
    <label for="message">About Yourself</label>
    <textarea id="message" name="message" rows="4" placeholder="Write something..."></textarea>

    <!-- File Upload -->
    <label for="photo">Upload Photo</label>
    <input type="file" id="photo" name="photo">

    <!-- Range -->
    <label for="satisfaction">Satisfaction Level</label>
    <input type="range" id="satisfaction" name="satisfaction" min="0" max="10">

    <!-- Color -->
    <label for="color">Favorite Color</label>
    <input type="color" id="color" name="color">

    <!-- URL -->
    <label for="website">Website</label>
    <input type="url" id="website" name="website" placeholder="https://example.com">

    <!-- Buttons -->
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

</form>

</body>
</html>
